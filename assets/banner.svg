<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Card Overlay Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes barGrow {
        0%, 100% { transform: scaleY(0.95); }
        50% { transform: scaleY(1.05); }
      }
      .floating-card { animation: floatSlow 6s ease-in-out infinite; }
      .floating-card-delay { animation: floatSlow 7s ease-in-out 2s infinite; }
      .glowing-grid { animation: pulseGlow 4s ease-in-out infinite; }
      .chart-line {
        stroke-dasharray: 1000;
        animation: dashMove 8s linear infinite;
      }
      .animated-bar { transform-origin: bottom; animation: barGrow 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>

  <!-- Subtle Dynamic Grid Lines in Background -->
  <g class="glowing-grid" stroke="#1e293b" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Background Dynamic Financial Chart Waves (Behind Text) -->
  <g stroke="url(#accentGrad)" stroke-width="2" fill="none" opacity="0.25" class="chart-line">
    <path d="M 0 300 Q 200 220 400 270 T 800 180 T 1200 120"/>
    <path d="M 0 340 Q 300 260 600 310 T 1000 210 T 1200 170"/>
  </g>

  <!-- Background Decorative Glowing Spheres -->
  <circle cx="100" cy="80" r="140" fill="#10b981" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1100" cy="320" r="160" fill="#3b82f6" opacity="0.08" filter="url(#glow)"/>

  <!-- Dynamic Right-Side Accent Graphic (Pills / Cards in Background Layer) -->
  <g class="floating-card-delay" transform="translate(860, 60)" opacity="0.85">
    <rect width="280" height="150" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">PORTFOLIO CONSOLIDATION</text>
    <text x="24" y="75" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700">$14.8 Billion</text>
    <text x="24" y="105" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">▲ +12.4% Multi-Asset YoY</text>
    <!-- Mini animated bars -->
    <rect x="200" y="115" width="10" height="20" rx="3" fill="#10b981" class="animated-bar"/>
    <rect x="215" y="105" width="10" height="30" rx="3" fill="#06b6d4" class="animated-bar" style="animation-delay: 0.5s;"/>
    <rect x="230" y="95" width="10" height="40" rx="3" fill="#3b82f6" class="animated-bar" style="animation-delay: 1s;"/>
  </g>

  <g class="floating-card" transform="translate(900, 230)" opacity="0.85">
    <rect width="240" height="110" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="35" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">MULTI-ENTITY ACCOUNTING</text>
    <text x="20" y="65" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">42 Entities Active</text>
    <rect x="20" y="80" width="120" height="8" rx="4" fill="#334155"/>
    <rect x="20" y="80" width="95" height="8" rx="4" fill="#06b6d4"/>
  </g>

  <!-- FOREGROUND LAYER: MAIN TITLE & SUBTITLE (Guaranteed on Top) -->
  <g transform="translate(60, 0)">
    <!-- Top Badge Header -->
    <g transform="translate(0, 85)">
      <rect width="290" height="32" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <circle cx="16" cy="16" r="5" fill="#34d399"/>
      <text x="32" y="21" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">CURATED FINTECH ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="175" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-1">
      Awesome Family Office
    </text>
    <text x="0" y="225" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-1" filter="url(#glow)">
      Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="275" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      SaaS Platforms &amp; Open-Source Engines for Multi-Entity Portfolio Reporting,
    </text>
    <text x="0" y="302" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
      Investment Accounting, Consolidated Wealth Views &amp; Private Client Operations
    </text>

    <!-- Feature Tag Pills -->
    <g transform="translate(0, 332)">
      <rect x="0" y="0" width="160" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="12" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📊 SaaS Pricing &amp; Scale</text>

      <rect x="172" y="0" width="180" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="184" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔓 Open-Source Engines</text>

      <rect x="364" y="0" width="170" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="376" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🏢 Multi-Entity Ledgers</text>
    </g>
  </g>
</svg>
